name: Refresh profile visuals

on:
  schedule:
    - cron: '27 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/render_profile.py
      - tests/test_profile_visuals.py
      - .github/workflows/profile-visuals.yml

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check calendar parsing and statistics
        run: python -m unittest discover -s tests -v
      - name: Render the profile artwork
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/render_profile.py
      - name: Save updated artwork
        run: |
          git add assets/stack-*.svg assets/activity-*.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh GitHub activity artwork'
          git push
